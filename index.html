<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message for You 🎄</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5016 50%, #8b0000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            font-size: 1em;
            opacity: 0.8;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        .container {
            max-width: 600px;
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .card {
            background: #fffef7;
            border-radius: 10px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            border: 1px solid #d4af37;
        }

        .greeting {
            color: #1a472a;
            font-size: 2em;
            margin-bottom: 40px;
            font-family: 'Georgia', serif;
        }

        .plane {
            font-size: 3.5em;
            margin: 30px 0;
            animation: fly 3s ease-in-out infinite;
        }

        @keyframes fly {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(10px) translateY(-5px); }
        }

        .destination {
            color: #c41e3a;
            font-size: 3em;
            font-weight: bold;
            margin: 30px 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #2c2c2c;
            font-size: 1.3em;
            margin-bottom: 40px;
        }

        .signature {
            color: #1a472a;
            font-size: 1.5em;
            margin-top: 50px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .card { padding: 45px 25px; }
            .greeting { font-size: 1.6em; }
            .destination { font-size: 2.2em; }
            .plane { font-size: 2.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <p class="greeting">Dear Dad,</p>
            
            <div class="plane">✈️</div>
            
            <h1 class="destination">San Francisco</h1>
            
            <p class="subtitle">A round-trip flight, just for you</p>
            
            <p class="signature">— Me</p>
        </div>
    </div>

    <script>
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❄';
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = Math.random() * 3 + 5 + 's';
            snowflake.style.fontSize = Math.random() * 10 + 10 + 'px';
            snowflake.style.opacity = Math.random() * 0.5 + 0.3;
            document.body.appendChild(snowflake);

            setTimeout(() => {
                snowflake.remove();
            }, 8000);
        }

        setInterval(createSnowflake, 200);
    </script>
</body>
</html>
